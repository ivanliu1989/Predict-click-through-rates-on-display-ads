[pytest]
# Pytest configuration for CTR Prediction project

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Options
addopts =
    --verbose
    --strict-markers
    --tb=short
    --disable-warnings
    # Coverage options (uncomment when ready)
    # --cov=.
    # --cov-report=html
    # --cov-report=term-missing
    # --cov-fail-under=80

# Markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    requires_data: marks tests that require actual data files

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Ignore patterns
norecursedirs = .git .tox dist build *.egg venv env

# Timeout (in seconds) for individual tests
# timeout = 300
